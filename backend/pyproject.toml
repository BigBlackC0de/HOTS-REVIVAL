[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hots-revival-backend"
version = "0.1.0"
description = "HOTS REVIVAL – API locale : import de replays, statistiques, HEROS SCORE, draft et coach IA."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "watchdog>=4.0",
  "psutil>=5.9",
  "beautifulsoup4>=4.12",
  "httpx>=0.27",
  "anthropic>=1.12",
  "heroprotocol>=2.55",
  "mpyq>=0.2.5",
  "sentry-sdk[fastapi]>=2.10",
  "posthog>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
